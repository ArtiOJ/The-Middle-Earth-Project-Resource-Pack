name: Build resource-pack release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Create installable resource-pack ZIP
        run: |
          cd "The Middle Earth Project"
          zip -r "../The-Middle_Earth-Project.zip" \
            assets \
            pack.mcmeta \
            pack.png

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: The-Middle_Earth-Project.zip