# To create new release run:
#   
#   git tag [ex. v2.3.0]
#   git push origin [tag^]
#

name: Build resource-pack release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Create installable resource-pack ZIP
        run: |
          cd "The Middle Earth Project"
          zip -r "../The-Middle_Earth-Project-${GITHUB_REF_NAME}.zip" \
            assets \
            pack.mcmeta \
            pack.png
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: The-Middle_Earth-Project-${{ github.ref_name }}.zip